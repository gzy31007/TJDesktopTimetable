# C# 线的构建与测试。
#
# 两个解决方案刻意分开，因为平台要求不同：
# - `dotnet/TjtTimetable.slnx`：平台无关的核心库 + 挂件视觉层（Tjt.Widget），
#   Linux 与 Windows 都能 `dotnet test`；
# - `dotnet/TjtTimetable.Windows.slnx`：WinUI 3 外壳（Tjt.App），**只能**在 Windows 上编译。
#   不要把它并进上面那个 slnx，否则 Linux 上的构建整片失败。
#
# WinUI 外壳在这里做两件事：编译 + 跑一次 `--smoke` 自检（建窗口、渲染课表、校验布局）。
name: csharp

on:
  push:
    paths:
      - 'dotnet/**'
      - 'packages/core/fixtures/**'
      - '.github/workflows/build-csharp.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'packages/core/fixtures/**'
      - '.github/workflows/build-csharp.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/TjtTimetable.slnx
      - name: Test
        run: dotnet test dotnet/TjtTimetable.slnx --no-restore --configuration Release

  winui-shell:
    # WinUI 3 只能 Windows 构建；net10.0-windows10.0.22621.0 要求 Windows SDK 22621。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore（WinUI 外壳）
        run: dotnet restore dotnet/TjtTimetable.Windows.slnx
      - name: Build（WinUI 外壳）
        run: dotnet build dotnet/TjtTimetable.Windows.slnx --configuration Release --no-restore
      # 无显卡的 runner 上，WASDK 的 bootstrap 在找不到匹配的 Windows App Runtime 时会
      # **挂在 DispatcherQueue/XAML 初始化之前**：实测 stdout 一行都没有、90 秒超时被杀。
      # 所以先把 1.8 运行时静默装上（框架依赖部署本来就要求目标机有它）。
      - name: Install Windows App Runtime 1.8
        shell: pwsh
        run: |
          $url = 'https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'windowsappruntimeinstall-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          $p = Start-Process -FilePath $dest -ArgumentList '--quiet' -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Windows App Runtime 安装超时' }
          Write-Host "runtime installer exit=$($p.ExitCode)"
          Get-AppxPackage *WindowsAppRuntime.1.8* | Select-Object -ExpandProperty Name

      # 冒烟自检：建窗口 + 渲染课表 + 校验布局。
      #
      # 两层超时保护：WinUI 在没有交互式桌面的 runner 上有可能卡在某一步，
      # 不设超时的话 job 会无限期 in_progress（本项目实测过一次）。
      #   1) timeout-minutes 兜住整个 job；
      #   2) 这里再给 wait 兜一次，超时即杀进程并按失败处理。
      - name: Smoke（建窗口 + 渲染课表 + 布局自检）
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "dotnet/Tjt.App/bin/Release/net10.0-windows10.0.22621.0/win-x64/Tjt.App.exe"
          $log = Join-Path $env:RUNNER_TEMP "tjt-app.log"
          # 应用是 WinExe（GUI 子系统），不附加控制台，重定向 stdout 拿不到东西 ——
          # 所以让它自己写 --log 指定的文件，这里读文件。--no-backdrop：runner 没有显卡。
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke', '--no-backdrop', '--log', $log, '--fixture', 'packages/core/fixtures/tongji-2026-1-personal.json' -PassThru
          $finished = $p.WaitForExit(60000)
          if (-not $finished) {
            Write-Host "自检 60 秒未退出，强杀"
            try { $p.Kill() } catch { }
          }
          Write-Host "---- app log ($log) ----"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } } else { Write-Host "(no log file)" }
          if (-not $finished) { throw "冒烟自检超时（60s 未退出）" }
          Write-Host "smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "冒烟自检失败（exit $($p.ExitCode)）" }

      - name: Upload（WinUI 外壳产物）
        uses: actions/upload-artifact@v4
        with:
          name: tjt-app-win-x64
          if-no-files-found: error
          retention-days: 14
          path: dotnet/Tjt.App/bin/Release/net10.0-windows10.0.22621.0/win-x64/
