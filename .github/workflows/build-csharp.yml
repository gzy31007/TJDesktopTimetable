# C# 线的构建与测试。
#
# 三个解决方案刻意分开，因为平台要求不同：
# - `dotnet/TjtTimetable.slnx`：平台无关的核心库 + 挂件视觉层（Tjt.Widget），
#   Linux 与 Windows 都能 `dotnet test`；
# - `dotnet/TjtTimetable.Windows.slnx`：WinUI 3 外壳（Tjt.App），**只能**在 Windows 上编译。
#   不要把它并进上面那个 slnx，否则 Linux 上的构建整片失败。
# - `dotnet/TjtTimetable.Linux.slnx`：Avalonia Linux 外壳（Tjt.Linux，fork 新增），
#   只在 Linux 上构建；Windows runner 上不跑。
#
# WinUI 外壳只编译；独立 Windows job 跑验收运行器的合成安全回归，不启动 WinUI。
name: csharp

on:
  push:
    branches-ignore: ['release-gate-test/**']
    tags-ignore: ['**']
    paths:
      - 'dotnet/**'
      - 'dotnet/fixtures/**'
      - 'scripts/acceptance/**'
      - '.github/workflows/**'
      - 'scripts/release/**'
      - 'installer/**'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'dotnet/fixtures/**'
      - 'scripts/acceptance/**'
      - '.github/workflows/**'
      - 'scripts/release/**'
      - 'installer/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: 待测与待编译的完整提交 SHA；发布协调传事件 SHA，留空则用 github.sha。
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Release gate regression
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  acceptance-runner:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Runner safety（真实子进程、超时、中断与清理；不启动 WinUI）
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/acceptance/Test-Runner.ps1
          -RunRoot "${{ github.workspace }}\.artifacts\runner-safety"
      - name: Acceptance entry guards（危险缓存路径在写入前拒绝）
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/acceptance/Test-EntryGuards.ps1
          -RunRoot "${{ github.workspace }}\.artifacts\entry-guards"
      - name: Upload（仅合成安全回归日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-runner-safety
          path: |
            .artifacts/runner-safety/
            .artifacts/entry-guards/
          if-no-files-found: warn
          retention-days: 7

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/TjtTimetable.slnx
      - name: Test
        run: dotnet test dotnet/TjtTimetable.slnx --no-restore --configuration Release

  winui-shell:
    # WinUI 3 只能 Windows 构建；net10.0-windows10.0.22621.0 要求 Windows SDK 22621。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore（WinUI 外壳）
        run: dotnet restore dotnet/TjtTimetable.Windows.slnx
      - name: Build（WinUI 外壳）
        run: dotnet build dotnet/TjtTimetable.Windows.slnx --configuration Release --no-restore
      # 这里只做**编译门禁**：Windows runner 上用真实的 Windows SDK + XAML 编译器构建，
      # 挡住"只有 Windows 才编得过"的代码问题（本地 WSL 的 EnableWindowsTargeting 会在 XAML 步停住）。
      #
      # 为什么不在 CI 里跑运行时冒烟：GitHub 的 runner 上，`Tjt.App.exe` 起得来做不到 ——
      # 装了 Windows App Runtime 1.8 之后仍然是"进程挂着且**一行输出都没有**"（连我们写在
      # App 构造函数第一行的文件日志都没落盘），说明卡点在 WASDK 引导路径内部，不在我们的代码里。
      # 反过来，本机（RTX 5070 + 1.8 运行时）两条路径都是实测通过的：
      # 带材质 `[backdrop] mode=mica-controller`、不带材质 `[backdrop] skipped`，
      # 两种都 `[smoke] ok blocks=19 canvas=977x600`。运行时验证走 scripts/acceptance/Invoke-Acceptance.ps1。

      - name: Upload（WinUI 外壳产物）
        uses: actions/upload-artifact@v4
        with:
          name: tjt-app-win-x64
          if-no-files-found: error
          retention-days: 14
          path: dotnet/Tjt.App/bin/Release/net10.0-windows10.0.22621.0/win-x64/

  linux-shell:
    # Avalonia Linux 外壳（Tjt.Linux）：ubuntu 上编译 + 自包含发布。
    # 只做编译门禁与产物上传；GUI 运行时行为（贴桌面层 / 显示桌面可见性）需真机验收。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore（Linux 外壳）
        run: dotnet restore dotnet/TjtTimetable.Linux.slnx
      - name: Build（Linux 外壳）
        run: dotnet build dotnet/TjtTimetable.Linux.slnx --configuration Release --no-restore
      - name: Publish（linux-x64 自包含）
        run: dotnet publish dotnet/Tjt.Linux/Tjt.Linux.csproj -c Release -r linux-x64 --self-contained /p:PublishSingleFile=true /p:DebugType=embedded
      - name: Upload（Linux 外壳产物）
        uses: actions/upload-artifact@v4
        with:
          name: tjt-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: dotnet/Tjt.Linux/bin/Release/net10.0/linux-x64/publish/
