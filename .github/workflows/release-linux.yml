name: Release (Linux)

# 统一发布入口调用 → 产出自包含的 Avalonia Linux 资产，不操作 Release。
#
# 与 release-winui.yml 平行，仅构建 Actions 资产，由 release.yml 统一草稿收尾；本中间版本冻结公开。
#
# 只做构建与打包，**不跑 GUI 运行时验收**：runner 上没有 X11 会话，
# 贴桌面层 / 显示桌面可见性 / 拖缩这些行为只能在真机（KDE X11 / XWayland）上看，
# 见 README「Linux 版」一节的验收口径。

# 仅由统一 release.yml 调用；本平台无 Release 写权限。
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      fail-build:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify source and isolated fault
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          FAIL_BUILD: ${{ inputs.fail-build }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Source SHA mismatch' }
          if ($env:FAIL_BUILD -eq 'true') {
            if ($env:GITHUB_REF -notlike 'refs/heads/release-gate-test/*') { throw 'Faults are rehearsal-only' }
            throw 'Intentional isolated platform failure'
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（Tjt.Linux，自包含 linux-x64 单文件）
        run: >
          dotnet publish dotnet/Tjt.Linux/Tjt.Linux.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=embedded
          --output publish

      - name: 打包（tar.gz + 使用说明）
        run: |
          set -euo pipefail
          if [ ! -x publish/Tjt.Linux ]; then
            echo "publish 产物里没有可执行的 Tjt.Linux："
            ls -la publish
            exit 1
          fi
          # 版本号取自 Directory.Build.props（Release tag 与它应当一致；由调用方硬门禁校验一致）
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' dotnet/Directory.Build.props | head -1)
          name="TJDesktopTimetable-v${version}-linux-x64"
          cat > publish/使用说明.txt <<EOF
          TJDesktopTimetable v${version} · 同济桌面课表小组件（Avalonia Linux 版）

          1. 解压到任意目录，例如 ~/.local/opt/TJDesktopTimetable
          2. 运行其中的 Tjt.Linux（自包含产物，不需要预装 .NET）
          3. 首次启动时若还没有课表，会打开导入窗口：浏览器 F12 → Network → 打开「我的课表」页刷新 →
             找到返回 200、内容是课程列表的那条请求 → 右键 Copy → Copy as cURL → 粘贴 → 获取我的课表

          运行时依赖：X11 或 XWayland（Avalonia 稳定线没有原生 Wayland 后端）；
          Avalonia X11 后端还需要 libICE / libSM —— Debian/Ubuntu: sudo apt install libice6 libsm6，
          Arch: sudo pacman -S libice libsm（桌面发行版一般随 DE 装好了，缺了会启动即崩）。
          中文课表需要一个含 CJK 的字体（noto-fonts-cjk / fonts-noto-cjk 等），否则中文渲染成方框。

          数据目录：~/.config/TJDesktopTimetable/（settings.json / timetable.json / credentials.json）
          卸载：删掉本目录；想清干净就把数据目录一并删掉。
          桌面集成（可选）：把仓库里的 dotnet/Tjt.Linux/packaging/tjt-linux.desktop 拷到
          ~/.local/share/applications/，再把 Exec= 指向解压目录下的 Tjt.Linux、Icon= 指向
          Assets/app-256.png，然后 update-desktop-database 刷新。

          已知限制见仓库 README。
          EOF
          tar -czf "${name}.tar.gz" -C publish .
          echo "打包完成：${name}.tar.gz"
          ls -l "${name}.tar.gz"
          tar -tzf "${name}.tar.gz" > /tmp/tjt-package-list.txt
          head -20 /tmp/tjt-package-list.txt

      - name: build-proof.json（本平台产物证明，随包同一 artifact）
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = os.environ.get("EXPECTED_SHA", "").strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          if expected and head != expected:
              raise SystemExit("checkout HEAD 与期望 SHA 不一致：%s != %s" % (head, expected))

          def digest(path):
              sha256 = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      sha256.update(chunk)
              return sha256.hexdigest()

          packages = sorted(Path(".").glob("TJDesktopTimetable-v*-linux-x64.tar.gz"))
          if len(packages) != 1:
              raise SystemExit("Linux 必须恰好一个包，实际 %d 个" % len(packages))

          proof = {
              "schema": 1,
              "repo": os.environ["GITHUB_REPOSITORY"],
              "sha": head,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "platform": "linux",
              "assets": [
                  {"name": path.name, "size": path.stat().st_size, "sha256": digest(path)}
                  for path in packages
              ],
          }
          Path("build-proof.json").write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(proof, indent=2))
          PY

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.run_id }}-${{ github.run_attempt }}
          # 包与证明进同一个 artifact；协调侧只按精确名字下到 downloaded/linux。
          path: |
            TJDesktopTimetable-v*-linux-x64.tar.gz
            build-proof.json
          if-no-files-found: error
          retention-days: 7
