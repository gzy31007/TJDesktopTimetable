name: Build Windows

# 本地 WSL 交叉打包只需 --dir（免安装 win-unpacked，不需要 wine）；
# 需要 NSIS 安装包时用这个 workflow（windows runner 上打），产物为 artifact。
on:
  workflow_dispatch:
    inputs:
      target:
        description: electron-builder target
        default: nsis
        type: choice
        options: [nsis, zip, dir]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build renderer & main
        run: pnpm -F @tjt/desktop build

      - name: Package (electron-builder)
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --x64 --publish never --config.win.target=${{ inputs.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TJDesktopTimetable-${{ inputs.target }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/win-unpacked/**
          if-no-files-found: warn
