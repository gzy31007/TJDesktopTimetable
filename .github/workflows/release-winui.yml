name: Release (WinUI)

# 统一发布入口调用 → 产出自包含的 WinUI 资产，不操作 Release。
#
# 为什么自包含：框架依赖版要求用户装 .NET 10 桌面运行时 **且** Windows App Runtime 1.8 —— 那条路
# 对"下载一个 zip 就能用"来说太贵。`WindowsAppSDKSelfContained=true` + `--self-contained` 把两者
# 都打进产物，代价只是 zip 大一些。
#
# 每个 Release 挂两个 Windows 资产（2026-09-17 起）：
#   TJDesktopTimetable-v<版本>-setup.exe         ← Inno Setup 安装包，普通人双击就能装（推荐）
#   TJDesktopTimetable-v<版本>-win-x64.zip       ← 自包含 zip，给想手动解压的人
# 「新版本提示」优先给 setup.exe（`UpdateCheck.WindowsPackageSuffixes`），找不到才退回 zip。
#
# 只做构建与打包，**不跑运行时冒烟**：GitHub runner 上 WASDK 引导路径会挂住且无输出（见 build-csharp.yml
# 里的说明），运行时验证走 scripts/acceptance/Invoke-Acceptance.ps1。

# 仅由统一 release.yml 调用；本平台无 Release 写权限。
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      fail-build:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify source and isolated fault
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          FAIL_BUILD: ${{ inputs.fail-build }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Source SHA mismatch' }
          if ($env:FAIL_BUILD -eq 'true') {
            if ($env:GITHUB_REF -notlike 'refs/heads/release-gate-test/*') { throw 'Faults are rehearsal-only' }
            throw 'Intentional isolated platform failure'
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（Tjt.App，自包含 win-x64）
        run: >
          dotnet publish dotnet/Tjt.App/Tjt.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:Platform=x64
          --output publish

      - name: 打包（zip + 使用说明）
        shell: pwsh
        run: |
          $exe = 'publish\Tjt.App.exe'
          if (-not (Test-Path $exe)) { throw "publish 产物里没有 Tjt.App.exe" }
          # 版本号取自 Directory.Build.props（Release tag 与它应当一致；由调用方硬门禁校验一致）
          $version = (Select-String -Path 'dotnet\Directory.Build.props' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $name = "TJDesktopTimetable-v$version-win-x64"
          $readme = @(
            "TJDesktopTimetable v$version · 同济桌面课表小组件（WinUI 3）",
            "",
            "1. 把本目录解压到任意本地磁盘路径（不要放在 \\\\wsl.localhost\\... 这类 UNC 路径下）",
            "2. 双击 Tjt.App.exe（自包含产物，不需要预装 .NET 或 Windows App Runtime）",
            "3. 首次启动会打开设置窗口的「导入课表」页：浏览器 F12 → Network → 在「我的课表」页刷新 →",
            "   找到返回 200、内容是课程列表的那条请求 → 右键 Copy → Copy as cURL → 粘贴 → 点「获取我的课表」",
            "",
            "数据目录：%APPDATA%\TJDesktopTimetable\（settings.json / timetable.json / credentials.json）",
            "卸载：删掉本目录；想清干净就把数据目录一并删掉。",
            "已知限制见仓库 README。"
          ) -join "`r`n"
          Set-Content -Path 'publish\使用说明.txt' -Value $readme -Encoding utf8
          Compress-Archive -Path 'publish\*' -DestinationPath "$name.zip" -Force
          Write-Host "打包完成：$name.zip"
          Get-ChildItem "$name.zip" | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 构建安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          $version = (Select-String -Path 'dotnet\Directory.Build.props' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          # SourceDir 指向上面 publish 出来的自包含产物；OutputDir 是仓库根，好让上传步骤直接找得到
          & $iscc "/Qp" "/DSourceDir=$($PWD.Path)\publish" "/DMyAppVersion=$version" "/DOutputDir=$($PWD.Path)" 'installer\TJDesktopTimetable.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit=$LASTEXITCODE)" }
          Get-ChildItem 'TJDesktopTimetable-*-setup.exe' | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: build-proof.json（本平台产物证明，随包同一 artifact）
        shell: python
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = os.environ.get("EXPECTED_SHA", "").strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
          if expected and head != expected:
              raise SystemExit("checkout HEAD 与期望 SHA 不一致：%s != %s" % (head, expected))

          def digest(path):
              sha256 = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      sha256.update(chunk)
              return sha256.hexdigest()

          packages = sorted(Path(".").glob("TJDesktopTimetable-v*-win-x64.zip")) + sorted(
              Path(".").glob("TJDesktopTimetable-v*-setup.exe")
          )
          if len(packages) != 2:
              raise SystemExit("Windows 必须恰好两个包，实际 %d 个" % len(packages))

          proof = {
              "schema": 1,
              "repo": os.environ["GITHUB_REPOSITORY"],
              "sha": head,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "platform": "windows",
              "assets": [
                  {"name": path.name, "size": path.stat().st_size, "sha256": digest(path)}
                  for path in packages
              ],
          }
          Path("build-proof.json").write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(proof, indent=2))

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.run_id }}-${{ github.run_attempt }}
          # 包与证明进同一个 artifact；协调侧只按精确名字下到 downloaded/windows。
          path: |
            TJDesktopTimetable-v*-win-x64.zip
            TJDesktopTimetable-v*-setup.exe
            build-proof.json
          if-no-files-found: error
          retention-days: 7
