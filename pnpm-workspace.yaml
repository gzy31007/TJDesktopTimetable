packages:
  - packages/*
  - apps/*

# electron-builder 收集依赖更稳（避免 pnpm 严格软链结构带来的打包缺件）
nodeLinker: hoisted

# 在 Linux(WSL) 上同时安装 win32 平台预编译包：
# koffi 通过 optionalDependencies 分发 @koromix/koffi-win32-x64，交叉打包 Windows 产物必需。
# linux 必须保留，否则 vitest/esbuild/rollup 的本地二进制装不上。
supportedArchitectures:
  os:
    - linux
    - win32
  cpu:
    - x64

# 注意：代理不写在这里（CI 上会失效）。
# WSL 本地安装请用：
#   pnpm install --config.proxy=http://127.0.0.1:7897 --config.https-proxy=http://127.0.0.1:7897
fetchTimeout: 900000

# pnpm 11 默认拦截依赖的 postinstall（supply-chain 政策）。
# 放行说明：
#   esbuild  —— 放置平台二进制（构建/测试必需）
#   koffi/electron 关掉：
#     koffi 3.x 的预编译二进制由 optionalDependencies（@koromix/koffi-win32-x64）分发，
#     已随 supportedArchitectures 装上，install 脚本（cnoke 构建）不需要；
#     electron 的 postinstall 只下载"当前平台"的运行时（Linux 版 ~100MB），
#     WSL 内不跑 Electron GUI，而交叉打包 Windows 时 electron-builder 会自行下载 win32 包。
#   electron-winstaller 仅 Squirrel 安装包需要，本项目用 dir/zip/NSIS。
allowBuilds:
  esbuild: true
  koffi: false
  electron: false
  electron-winstaller: false
