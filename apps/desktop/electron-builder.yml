appId: com.gzy31007.tjdesktoptimetable
productName: TJDesktopTimetable
copyright: Copyright © 2026 gzy31007

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true
# koffi 是预编译原生模块，必须解包到 asar 之外才能加载
asarUnpack:
  - '**/*.node'
  - node_modules/koffi/**
  - node_modules/@koromix/**

extraResources:
  - from: resources/icon.ico
    to: icon.ico

# koffi 自带预编译二进制，不需要 rebuild
npmRebuild: false

# 在 WSL/Linux 上交叉打包 Windows 产物时，从这里下载 win32 的 electron 二进制
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: dir
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 同济桌面课表
